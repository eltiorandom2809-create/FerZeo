<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>FerZeo | Move with Purpose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000000;
  --bg-elevated: #0d0d0d;
  --surface: #161616;
  --text: #f5f5f5;
  --text-muted: #888;
  --text-dim: #555;
  --border: #222;
  --accent: #fff;
  --accent-soft: rgba(255,255,255,0.08);
  --radius: 12px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #000;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }

/* ========== HEADER ========== */
.bar {
  height: 64px;
  padding: 0 4%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(0,0,0,0.88);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid transparent;
  transition: border-color 0.35s;
}
.bar.scrolled { border-bottom-color: #1a1a1a; }
.logo {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: 5px;
  text-transform: uppercase;
  transition: opacity 0.25s;
}
.logo:hover { opacity: 0.6; }
.actions { display: flex; gap: 2px; }
.actions button {
  width: 42px; height: 42px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; border-radius: 50%;
  transition: background 0.25s, transform 0.2s;
  position: relative;
}
.actions button:hover { background: var(--accent-soft); }
.actions button:active { transform: scale(0.9); }
.count {
  position: absolute; top: 4px; right: 2px;
  font-size: 9px; font-weight: 700;
  background: #fff; color: #000;
  border-radius: 50%; min-width: 15px; height: 15px;
  display: flex; align-items: center; justify-content: center;
}

/* ========== VIEWS ========== */
.view { display: none !important; }
.view.active { display: block !important; }

/* ========== HERO ========== */
.hero {
  height: min(680px, 82vh);
  min-height: 440px;
  position: relative;
  overflow: hidden;
  background: #050505;
}
.slides, .slide { position: absolute; inset: 0; }
.slide {
  opacity: 0;
  transition: opacity 1.1s var(--ease);
  background-size: cover;
  background-position: center;
  display: flex; align-items: center;
  padding: 0 5%;
  pointer-events: none;
}
.slide.active { opacity: 1; pointer-events: auto; }
.slide::before {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(105deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.25) 55%, transparent 100%);
}
.slide-content {
  position: relative; z-index: 2;
  max-width: 600px;
  transform: translateY(30px); opacity: 0;
  transition: all 0.95s 0.15s var(--ease-out);
}
.slide.active .slide-content { transform: none; opacity: 1; }
.eyebrow {
  font-size: 10px; letter-spacing: 3px; font-weight: 600;
  text-transform: uppercase; color: rgba(255,255,255,0.55);
  margin-bottom: 14px;
}
.slide h1 {
  font-size: clamp(44px, 9vw, 88px);
  font-weight: 800; line-height: 0.92;
  letter-spacing: -2.8px; margin: 0 0 18px;
  text-transform: uppercase;
}
.slide p {
  max-width: 380px; font-size: 15px; line-height: 1.6;
  color: rgba(255,255,255,0.7); margin-bottom: 28px;
}
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: #fff; color: #000;
  padding: 14px 24px;
  font-size: 11px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase;
  border-radius: 100px;
  transition: transform 0.3s var(--ease), box-shadow 0.3s;
}
.btn.light { background: #fff; color: #000; }
.btn.dark { background: #111; color: #fff; border: 1px solid #333; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0,0,0,0.4); }
.btn:active { transform: scale(0.97); }

.dots {
  position: absolute; z-index: 5; bottom: 28px; left: 0; right: 0;
  display: flex; justify-content: center; gap: 8px;
}
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.4);
  background: transparent; padding: 0;
  transition: all 0.35s;
}
.dot.active {
  background: #fff; border-color: #fff;
  transform: scale(1.35);
}
.arrow {
  position: absolute; z-index: 5; top: 50%; transform: translateY(-50%);
  width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(0,0,0,0.35); backdrop-filter: blur(8px);
  color: #fff; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s; opacity: 0;
}
.hero:hover .arrow { opacity: 1; }
.arrow:hover {
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.5);
  transform: translateY(-50%) scale(1.06);
}
.prev { left: 18px; } .next { right: 18px; }

/* ========== SECTIONS ========== */
.section {
  padding: 80px 4%;
  max-width: 1520px;
  margin: 0 auto;
}
.section-header { margin-bottom: 36px; }
.section h2 {
  font-size: clamp(28px, 4.8vw, 44px);
  font-weight: 800; letter-spacing: -1.4px; line-height: 1.05;
  margin-top: 6px;
}
.muted {
  color: var(--text-muted); font-size: 10px;
  letter-spacing: 2px; font-weight: 600; text-transform: uppercase;
}

/* Categories cards */
.cats {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  opacity: 1;
  visibility: visible;
}
.cat {
  height: 360px; background-size: cover; background-position: center;
  background-color: #222;
  display: flex; align-items: flex-end; padding: 24px;
  color: #fff; font-weight: 700; letter-spacing: 1.6px; font-size: 13px;
  position: relative; overflow: hidden; border-radius: var(--radius);
  transition: transform 0.5s var(--ease);
  cursor: pointer;
  opacity: 1;
  visibility: visible;
}
.cat::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 50%);
  pointer-events: none;
}
.cat:hover { transform: translateY(-6px); }
.cat span {
  position: relative; z-index: 2;
  display: flex; align-items: center; gap: 6px;
  transition: transform 0.35s;
}
.cat:hover span { transform: translateX(4px); }
.gym { background-image: url('https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1000&q=90'); }
.run { background-image: url('https://images.unsplash.com/photo-1552674605-db6ffd4facb5?auto=format&fit=crop&w=1000&q=90'); }
.casual { background-image: url('https://images.unsplash.com/photo-1523398002811-999ca8dec234?auto=format&fit=crop&w=1000&q=90'); }

/* Tools */
.tools {
  display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px;
}
.tools input, .tools select {
  padding: 12px 14px;
  border: 1px solid var(--border);
  background: var(--surface); color: var(--text);
  border-radius: 8px;
  flex: 1; min-width: 140px;
  outline: none; transition: border-color 0.25s;
}
.tools input:focus, .tools select:focus { border-color: #444; }
.tools input::placeholder { color: var(--text-dim); }
.tools select option { background: #1a1a1a; color: #fff; }

.search-wrap {
  max-width: 1520px;
  margin: 0 auto;
  padding: 0 4% 8px;
}
.search-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 4px 6px 4px 18px;
  max-width: 520px;
}
.search-bar input {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--text);
  padding: 12px 0;
  outline: none;
  font-size: 14px;
}
.search-bar input::placeholder { color: var(--text-dim); }
.search-bar button {
  background: #fff;
  color: #000;
  border-radius: 100px;
  padding: 10px 18px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

/* Checkout */
.checkout-bg {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(6px);
  z-index: 500;
  pointer-events: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.checkout-bg.open {
  display: flex;
  pointer-events: auto;
}
.checkout-modal {
  width: min(440px, 100%);
  background: #111;
  border: 1px solid #2a2a2a;
  border-radius: 16px;
  padding: 28px 24px;
  max-height: 90vh;
  overflow-y: auto;
}
.checkout-modal h2 {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin-bottom: 6px;
}
.checkout-modal .sub {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 22px;
}
.checkout-modal label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 6px;
  margin-top: 14px;
}
.checkout-modal input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #333;
  background: #0a0a0a;
  color: #fff;
  border-radius: 8px;
  outline: none;
}
.checkout-modal input:focus { border-color: #666; }
.checkout-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.checkout-total {
  margin: 20px 0 8px;
  padding: 14px;
  background: #1a1a1a;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
}
.checkout-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 18px;
}
.checkout-success {
  text-align: center;
  padding: 20px 10px;
}
.checkout-success .check {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: #22c55e;
  color: #fff;
  font-size: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 16px;
}
.pay-error {
  color: #f87171;
  font-size: 12px;
  min-height: 18px;
  margin-top: 8px;
}

/* ========== PRODUCT GRID ========== */
.products {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  position: relative;
  width: 100%;
  overflow: hidden;
}
.product {
  min-width: 0;
  opacity: 1;
  transform: none;
  transition: opacity 0.5s var(--ease-out), transform 0.5s var(--ease-out);
}
.product.visible { opacity: 1; transform: none; }
.product-link { display: block; cursor: pointer; }
.photo {
  height: 300px;
  background: #161616;
  position: relative;
  overflow: hidden;
  border-radius: var(--radius);
}
.photo img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform 0.65s var(--ease);
}
.product:hover .photo img { transform: scale(1.05); }
.heart {
  position: absolute; right: 10px; top: 10px;
  width: 36px; height: 36px;
  background: rgba(255,255,255,0.92); color: #111;
  border-radius: 50%; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.25s; z-index: 2;
}
.heart:hover { transform: scale(1.1); }
.product-info { padding: 14px 2px 0; }
.product h3 {
  font-size: 14px; font-weight: 600;
  letter-spacing: -0.2px; margin-bottom: 4px;
}
.product .cat-label {
  font-size: 10px; color: var(--text-muted);
  letter-spacing: 1px; text-transform: uppercase;
  margin-bottom: 5px;
}
.product .price { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.product .card-desc {
  font-size: 12px; color: var(--text-muted); line-height: 1.45;
  margin-bottom: 8px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.product .card-meta {
  font-size: 11px; color: var(--text-dim); margin-bottom: 10px;
}
.product .card-swatches {
  display: flex; gap: 6px; margin-bottom: 12px;
}
.product .card-swatch {
  width: 14px; height: 14px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.25);
}
.buy-btn {
  width: 100%;
  padding: 11px;
  border: 1px solid #333;
  background: transparent;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  border-radius: 100px;
  transition: background 0.25s, color 0.25s, border-color 0.25s;
}
.buy-btn:hover {
  background: #fff;
  color: #000;
  border-color: #fff;
}

/* ========== CATEGORY PAGE (inside layout) ========== */
.category-page {
  min-height: calc(100vh - 64px);
  background: #000;
  padding-bottom: 60px;
}
.cat-header {
  padding: 48px 4% 28px;
  max-width: 1520px;
  margin: 0 auto;
  border-bottom: 1px solid var(--border);
}
.breadcrumb {
  font-size: 12px; color: var(--text-muted);
  margin-bottom: 16px; letter-spacing: 0.3px;
}
.breadcrumb a { color: var(--text-muted); transition: color 0.2s; }
.breadcrumb a:hover { color: #fff; }
.breadcrumb span { color: #fff; }
.cat-header h1 {
  font-size: clamp(32px, 5vw, 52px);
  font-weight: 800; letter-spacing: -1.6px;
  line-height: 1.05; margin-bottom: 8px;
}
.cat-header p {
  font-size: 15px; color: var(--text-muted);
  max-width: 480px; line-height: 1.6;
}
.cat-grid-wrap {
  max-width: 1520px;
  margin: 0 auto;
  padding: 36px 4% 0;
}

/* ========== PRODUCT DRAWER (Alo Yoga style) ========== */
.pdp-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(4px);
  z-index: 300;
  pointer-events: none;
}
.pdp-overlay.open {
  display: block;
  pointer-events: auto;
}

.pdp-drawer {
  position: absolute;
  top: 0; right: 0;
  height: 100%;
  width: min(520px, 100vw);
  background: #fff;
  color: #111;
  overflow-y: auto;
  transform: translateX(100%);
  transition: transform 0.45s var(--ease-out);
  box-shadow: -20px 0 60px rgba(0,0,0,0.35);
}
.pdp-overlay.open .pdp-drawer { transform: translateX(0); }

.pdp-drawer-inner { padding: 0 0 40px; }

.pdp-drawer-top {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 22px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid #eee;
}
.pdp-drawer-top button {
  font-size: 13px; font-weight: 500; color: #555;
  padding: 6px 10px; border-radius: 6px;
  transition: color 0.2s, background 0.2s;
}
.pdp-drawer-top button:hover { color: #111; background: #f3f3f3; }
.pdp-drawer-top .logo {
  font-size: 15px; letter-spacing: 3px; color: #111;
}

.pdp-gallery {
  padding: 0 22px;
}
.pdp-main {
  width: 100%;
  aspect-ratio: 4/5;
  background: #f2f2f0;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 10px;
}
.pdp-main img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: filter 0.4s, opacity 0.35s;
}
.pdp-thumbs {
  display: flex; gap: 8px; overflow-x: auto;
  padding-bottom: 4px; scrollbar-width: none;
}
.pdp-thumbs::-webkit-scrollbar { display: none; }
.pdp-thumb {
  flex: 0 0 64px; height: 78px;
  border-radius: 8px; overflow: hidden;
  border: 2px solid transparent;
  cursor: pointer; opacity: 0.55;
  transition: opacity 0.25s, border-color 0.25s;
  background: #f2f2f0;
}
.pdp-thumb img { width: 100%; height: 100%; object-fit: cover; }
.pdp-thumb:hover { opacity: 0.85; }
.pdp-thumb.active { opacity: 1; border-color: #111; }

.pdp-info {
  padding: 24px 22px 0;
}
.pdp-kicker {
  font-size: 10px; letter-spacing: 2px;
  color: #888; font-weight: 600; text-transform: uppercase;
}
.pdp-info h1 {
  font-size: 26px; font-weight: 800;
  letter-spacing: -0.8px; line-height: 1.15;
  margin: 10px 0 8px; color: #111;
}
.pdp-price {
  font-size: 16px; font-weight: 500; color: #444;
  margin-bottom: 20px;
}
.pdp-desc {
  font-size: 14px; line-height: 1.65; color: #555;
  margin-bottom: 24px; padding-bottom: 22px;
  border-bottom: 1px solid #eee;
}

.pdp-label {
  font-size: 12px; font-weight: 600; color: #111;
  margin-bottom: 10px;
}
.pdp-label span { color: #777; font-weight: 400; }

.swatches { display: flex; gap: 10px; margin-bottom: 22px; }
.swatch {
  width: 30px; height: 30px; border-radius: 50%;
  border: 2px solid transparent;
  outline: 1.5px solid #ccc;
  cursor: pointer;
  transition: transform 0.25s, outline-color 0.25s;
}
.swatch:hover { transform: scale(1.1); }
.swatch.selected {
  outline: 2px solid #111;
  outline-offset: 2px;
}

.sizes { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 6px; }
.size-btn {
  height: 44px; min-width: 52px;
  border: 1px solid #ddd;
  background: #fff; border-radius: 8px;
  font-size: 12px; font-weight: 500; color: #111;
  transition: all 0.25s;
}
.size-btn:hover { border-color: #999; }
.size-btn.selected {
  border-color: #111; background: #111; color: #fff;
}

.pdp-error {
  font-size: 12px; color: #b42318;
  min-height: 18px; margin: 8px 0 4px;
}

.addbag {
  width: 100%; height: 52px;
  border-radius: 100px;
  background: #111; color: #fff;
  font-size: 13px; font-weight: 700;
  letter-spacing: 0.3px;
  margin: 14px 0 16px;
  transition: transform 0.25s, background 0.25s;
}
.addbag:hover { background: #000; transform: translateY(-1px); }
.addbag:active { transform: scale(0.98); }

.pdp-meta {
  font-size: 12px; color: #777; line-height: 1.8;
}
.pdp-details {
  margin-top: 28px;
  border-top: 1px solid #eee;
  padding-top: 8px;
}
.pdp-details details {
  border-bottom: 1px solid #eee;
}
.pdp-details summary {
  font-size: 13px; font-weight: 600; color: #111;
  cursor: pointer; padding: 14px 0;
  list-style: none; display: flex; justify-content: space-between;
}
.pdp-details summary::-webkit-details-marker { display: none; }
.pdp-details summary::after { content: "+"; font-size: 16px; color: #888; }
.pdp-details[open] summary::after { content: "−"; }
.pdp-details div, .pdp-details p {
  font-size: 13px; color: #666; line-height: 1.7;
  padding-bottom: 14px;
}

/* ========== CART DRAWER ========== */
.drawer-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
  z-index: 400;
  pointer-events: none;
}
.drawer-bg.open {
  display: block;
  pointer-events: auto;
}
.drawer {
  position: absolute; right: 0; top: 0; height: 100%;
  width: min(400px, 94vw); background: #0d0d0d;
  color: #f5f5f5;
  padding: 20px; overflow: auto;
  animation: slideInRight 0.4s var(--ease-out);
  border-left: 1px solid #1a1a1a;
}
.cartrow {
  display: flex; gap: 12px; padding: 14px 0;
  border-bottom: 1px solid #1a1a1a;
  position: relative;
}
.cartrow img {
  width: 64px; height: 78px; object-fit: cover;
  border-radius: 7px; background: #1a1a1a;
}
.cartrow b { font-size: 13px; font-weight: 600; }
.cartrow p { font-size: 12px; color: var(--text-muted); margin: 2px 0; }
.qty {
  display: flex; align-items: center; gap: 8px; margin-top: 6px;
}
.qty button {
  width: 26px; height: 26px; border: 1px solid #333;
  border-radius: 5px; display: flex; align-items: center; justify-content: center;
  font-size: 13px; transition: background 0.2s;
}
.qty button:hover { background: var(--accent-soft); }
.cart-remove {
  position: absolute; right: 0; top: 14px;
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: #666;
  transition: color 0.2s, background 0.2s;
